<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أجزاء الأفلام القصيرة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .auth-container, .dashboard-container, .feed-container {
            display: none;
        }

        .active-view {
            display: block;
        }

        .form-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            margin: 4rem auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .room-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .room-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .room-header {
            padding: 1.5rem;
        }

        .room-header h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .room-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .video-stream-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .video-player-wrapper {
            width: 100%;
            max-width: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 1rem;
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 1rem;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #2a3950;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .badge-active { background-color: #065f46; color: #34d399; }
        .badge-banned { background-color: #7f1d1d; color: #fca5a5; }

        .dashboard-section {
            margin-bottom: 2.5rem;
        }

        .dashboard-section h3 {
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 عروض الأفلام القصيرة</div>
    </header>

    <main>
        <div id="auth-view" class="auth-container active-view">
            <div class="form-card">
                <h2>تسجيل الدخول للمشاهدة</h2>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" placeholder="أدخل أي إيميل...">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" placeholder="أدخل كلمة المرور...">
                </div>
                <button class="btn" onclick="handleLogin()">دخول للمنصة</button>
            </div>
        </div>

        <div id="admin-view" class="dashboard-container">
            <h2>لوحة إدارة الفيديوهات</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">مرحباً بك يا محمد (المسؤول). يمكنك نشر أجزاء الأفلام والتحكم في المتابعين.</p>
            
            <div class="dashboard-section">
                <h3>نشر جزء فيلم جديد</h3>
                <div class="form-card" style="max-width: 100%; margin: 0; background-color: var(--card-bg);">
                    <div class="input-group">
                        <label>عنوان الفيلم</label>
                        <input type="text" id="admin-room-title" placeholder="مثال: فيلم الأكشن الخطير">
                    </div>
                    <div class="input-group">
                        <label>رقم الجزء</label>
                        <input type="number" id="admin-part-num" placeholder="1">
                    </div>
                    <div class="input-group">
                        <label>رابط فيديو اللقطة (MP4)</label>
                        <input type="text" id="admin-video-url" placeholder="https://example.com/video.mp4">
                    </div>
                    <button class="btn" onclick="adminAddVideo()">نشر الجزء الآن</button>
                </div>
            </div>

            <div class="dashboard-section">
                <h3>إدارة المستخدمين والمحظورين</h3>
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>البريد الإلكتروني</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            
            <button class="btn" style="background-color: var(--border-color); margin-top: 1rem;" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div id="feed-view" class="feed-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>قائمة الأفلام المتوفرة</h2>
                <button class="btn" style="width: auto; padding: 0.5rem 1rem;" onclick="logout()">تسجيل الخروج</button>
            </div>
            <div id="rooms-grid" class="rooms-grid">
            </div>
        </div>

        <div id="stream-view" class="feed-container">
            <button class="btn" style="width: auto; padding: 0.5rem 1rem; margin-bottom: 1rem;" onclick="backToRooms()">← الرجوع لقائمة الأفلام</button>
            <div class="video-stream-container">
                <div class="video-player-wrapper">
                    <video id="active-video" controls autoplay loop>
                        <source src="" id="video-source" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو
                    </video>
                </div>
                <div class="video-info">
                    <h3 id="current-video-title">عنوان الفيديو</h3>
                    <p id="current-video-part" style="color: var(--text-muted); margin-top: 0.5rem;">الجزء: 1</p>
                    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <button class="btn" onclick="prevPart()">الجزء السابق</button>
                        <button class="btn" onclick="nextPart()">الجزء التالي (التشويق)</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ADMIN_EMAIL = "jehejfkfbw@gmail.com";
        const ADMIN_PASS = "ddee4dab";

        let users = JSON.parse(localStorage.getItem('site_users')) || [];
        let videos = JSON.parse(localStorage.getItem('site_videos')) || [
            { id: 1, roomTitle: "فيلم الهروب الكبير", partNumber: 1, url: "https://www.w3schools.com/html/mov_bbb.mp4" },
            { id: 2, roomTitle: "فيلم الهروب الكبير", partNumber: 2, url: "https://www.w3schools.com/html/movie.mp4" },
            { id: 3, roomTitle: "أكشن السجون المرعب", partNumber: 1, url: "https://www.w3schools.com/html/mov_bbb.mp4" }
        ];

        let currentUser = JSON.parse(localStorage.getItem('current_user')) || null;
        let currentRoomName = null;
        let currentRoomParts = [];
        let currentPartIndex = 0;

        window.onload = function() {
            if (currentUser) {
                if (currentUser.isBanned) {
                    alert("حسابك محظور من قبل الإدارة.");
                    logout();
                    return;
                }
                if (currentUser.isAdmin) {
                    switchView('admin-view');
                    renderAdminDashboard();
                } else {
                    switchView('feed-view');
                    renderRooms();
                }
            } else {
                switchView('auth-view');
            }
        };

        function switchView(viewId) {
            document.querySelectorAll('.auth-container, .dashboard-container, .feed-container').forEach(el => {
                el.classList.remove('active-view');
            });
            document.getElementById(viewId).classList.add('active-view');
        }

        function handleLogin() {
            const emailInput = document.getElementById('login-email').value.trim();
            const passInput = document.getElementById('login-password').value.trim();

            if (!emailInput) {
                alert("الرجاء كتابة البريد الإلكتروني.");
                return;
            }

            let targetUser;
            let isAdmin = false;

            if (emailInput === ADMIN_EMAIL && passInput === ADMIN_PASS) {
                isAdmin = true;
            }

            targetUser = users.find(u => u.email === emailInput);
            if (!targetUser) {
                targetUser = { id: Date.now(), email: emailInput, isAdmin: isAdmin, isBanned: false };
                users.push(targetUser);
                localStorage.setItem('site_users', JSON.stringify(users));
            } else {
                if (isAdmin) targetUser.isAdmin = true;
            }

            if (targetUser.isBanned) {
                alert("عذراً، هذا الحساب محظور.");
                return;
            }

            currentUser = targetUser;
            localStorage.setItem('current_user', JSON.stringify(currentUser));

            if (currentUser.isAdmin) {
                switchView('admin-view');
                renderAdminDashboard();
            } else {
                switchView('feed-view');
                renderRooms();
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('current_user');
            switchView('auth-view');
        }

        function renderAdminDashboard() {
            const tbody = document.querySelector('#users-table tbody');
            tbody.innerHTML = '';
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.email}</td>
                    <td><span class="badge ${u.isBanned ? 'badge-banned' : 'badge-active'}">${u.isBanned ? 'محظور' : 'نشط'}</span></td>
                    <td>
                        ${!u.isAdmin ? `<button class="btn btn-danger" style="padding: 0.25rem 0.5rem; width: auto;" onclick="toggleBan(${u.id})">${u.isBanned ? 'إلغاء الحظر' : 'حظر / طرد'}</button>` : 'المسؤول الأساسي'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function adminAddVideo() {
            const roomTitle = document.getElementById('admin-room-title').value.trim();
            const partNum = parseInt(document.getElementById('admin-part-num').value);
            const videoUrl = document.getElementById('admin-video-url').value.trim();

            if (!roomTitle || !partNum || !videoUrl) {
                alert("الرجاء ملء جميع الحقول بنجاح.");
                return;
            }

            videos.push({ id: Date.now(), roomTitle, partNumber: partNum, url: videoUrl });
            localStorage.setItem('site_videos', JSON.stringify(videos));
            alert("تم نشر الجزء بنجاح!");
            document.getElementById('admin-room-title').value = '';
            document.getElementById('admin-part-num').value = '';
            document.getElementById('admin-video-url').value = '';
        }

        function toggleBan(userId) {
            const user = users.find(u => u.id === userId);
            if (user) {
                user.isBanned = !user.isBanned;
                localStorage.setItem('site_users', JSON.stringify(users));
                renderAdminDashboard();
            }
        }

        function renderRooms() {
            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';

            const roomsMap = {};
            videos.forEach(v => {
                if (!roomsMap[v.roomTitle]) roomsMap[v.roomTitle] = [];
                roomsMap[v.roomTitle].push(v);
            });

            if (Object.keys(roomsMap).length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">لا توجد أجزاء متاحة حالياً.</p>';
                return;
            }

            for (let roomName in roomsMap) {
                const partsCount = roomsMap[roomName].length;
                const card = document.createElement('div');
                card.className = 'room-card';
                card.onclick = () => openRoom(roomName, roomsMap[roomName]);
                card.innerHTML = `
                    <div class="room-header">
                        <h3>🎬 ${roomName}</h3>
                        <p>يحتوي على ${partsCount} جزء متسلسل</p>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function openRoom(roomName, partsList) {
            currentRoomName = roomName;
            currentRoomParts = partsList.sort((a, b) => a.partNumber - b.partNumber);
            currentPartIndex = 0;

            switchView('stream-view');
            loadCurrentPart();
        }

        function loadCurrentPart() {
            const part = currentRoomParts[currentPartIndex];
            document.getElementById('current-video-title').innerText = currentRoomName;
            document.getElementById('current-video-part').innerText = `الجزء رقم: ${part.partNumber} (من أصل ${currentRoomParts.length})`;
            
            const videoElement = document.getElementById('active-video');
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = part.url;
            videoElement.load();
            videoElement.play();
        }

        function nextPart() {
            if (currentPartIndex < currentRoomParts.length - 1) {
                currentPartIndex++;
                loadCurrentPart();
            } else {
                alert("هذا هو الجزء الأخير من هذا الفيلم! انتظر التحديثات القادمة للجزء الجديد.");
            }
        }

        function prevPart() {
            if (currentPartIndex > 0) {
                currentPartIndex--;
                loadCurrentPart();
            } else {
                alert("أنت في بداية أجزاء هذا الفيلم.");
            }
        }

        function backToRooms() {
            document.getElementById('active-video').pause();
            switchView('feed-view');
            renderRooms();
        }
    </script>
</body>
</html>
